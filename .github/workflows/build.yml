name: build

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o platform-db-tunnel.exe .

      - name: Checksum
        run: sha256sum platform-db-tunnel.exe > platform-db-tunnel.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: platform-db-tunnel-windows-amd64
          path: |
            platform-db-tunnel.exe
            platform-db-tunnel.exe.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: platform-db-tunnel-windows-amd64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            platform-db-tunnel.exe platform-db-tunnel.exe.sha256 \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --generate-notes
